<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IG Sorter</title>
<style>
  /* Tokens from the HeroUI v3 default theme (@heroui/styles 3.2.6, themes/default/variables.css).
     Changes: brand accent is IG magenta; light --muted darkened 0.5517 -> 0.51 and danger text
     uses --danger-soft-foreground, both to reach 4.5:1 (the raw values give 4.05-4.43 and 3.27). */
  :root {
    --white: oklch(100% 0 0); --snow: oklch(0.9911 0 0); --eclipse: oklch(0.2103 0.0059 285.89);
    --radius: 0.5rem; --field-radius: calc(var(--radius) * 1.5); --disabled-opacity: 0.5;
    --ease-out: cubic-bezier(0, 0, 0.2, 1);
    /* --accent fills primary buttons (snow text 4.98:1). --accent-text is for links and soft fills. */
    --accent: #c13584; --accent-foreground: var(--snow); --accent-text: #c13584;

    --background: oklch(0.9702 0 0); --foreground: var(--eclipse);
    --surface: var(--white); --surface-secondary: oklch(0.9524 0.0013 286.37);
    --muted: oklch(0.51 0.0138 285.94);
    --default: oklch(94% 0.001 286.375); --segment: var(--white);
    --field-background: var(--white); --field-foreground: var(--eclipse);
    --danger: oklch(0.6532 0.2328 25.74);
    --separator: oklch(92% 0.004 286.32);
    --surface-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.04), 0 1px 2px 0 rgba(0, 0, 0, 0.06), 0 0 1px 0 rgba(0, 0, 0, 0.06);
    --field-shadow: var(--surface-shadow);
    --overlay: var(--white); --backdrop: rgba(0, 0, 0, 0.5);
    --overlay-shadow: 0 2px 8px 0 rgba(0, 0, 0, 0.06), 0 -6px 12px 0 rgba(0, 0, 0, 0.03), 0 14px 28px 0 rgba(0, 0, 0, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent-text: #f06bb0;
      --background: oklch(12% 0.005 285.823); --foreground: var(--snow);
      --surface: oklch(0.2103 0.0059 285.89); --surface-secondary: oklch(0.257 0.0037 286.14);
      --muted: oklch(70.5% 0.015 286.067);
      --default: oklch(27.4% 0.006 286.033); --segment: oklch(0.3964 0.01 285.93);
      --field-background: oklch(0.2103 0.0059 285.89); --field-foreground: var(--snow);
      --danger: oklch(0.594 0.1967 24.63);
      --separator: oklch(25% 0.006 286.033);
      --surface-shadow: none; --field-shadow: none;
      --overlay: oklch(0.2103 0.0059 285.89); --backdrop: rgba(0, 0, 0, 0.6);
      --overlay-shadow: 0 0 1px 0 rgba(255, 255, 255, 0.3) inset;
    }
  }
  :root {
    /* Calculated colors, same formulas as HeroUI. */
    --focus: var(--accent);
    --default-hover: color-mix(in oklab, var(--default) 96%, var(--foreground) 4%);
    --accent-hover: color-mix(in oklab, var(--accent) 90%, var(--accent-foreground) 10%);
    --accent-soft: color-mix(in oklab, var(--accent-text) 15%, transparent);
    --accent-soft-foreground: color-mix(in oklab, var(--accent-text) 70%, var(--foreground) 30%);
    --danger-soft: color-mix(in oklab, var(--danger) 15%, transparent);
    --danger-soft-hover: color-mix(in oklab, var(--danger) 20%, transparent);
    --danger-soft-foreground: color-mix(in oklab, var(--danger) 70%, var(--foreground) 40%);
  }

  * { box-sizing: border-box; }
  /* Author display rules (flex, block) would otherwise beat the hidden attribute. */
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--background); color: var(--foreground); font: 15px/1.5 system-ui, "Noto Sans TC", sans-serif; }
  header { position: sticky; top: 0; z-index: 1; padding: 12px 16px; border-bottom: 1px solid var(--separator);
    background: color-mix(in oklab, var(--background) 85%, transparent); backdrop-filter: blur(12px); }
  .bar { display: flex; gap: 8px; align-items: center; max-width: 820px; margin: 0 auto; }
  h1 { font-size: 17px; margin: 0; flex: 1; }
  main, #status { max-width: 820px; margin: 0 auto; padding: 12px 16px; }
  #status { color: var(--muted); font-size: 13px; padding-bottom: 0; min-height: 1.5em; }
  #status.err { color: var(--danger-soft-foreground); }
  /* display:block would override the hidden attribute, so only set it while shown. */
  #prog:not([hidden]) { display: block; width: 100%; height: 4px; accent-color: var(--accent); }

  /* Buttons: HeroUI .button, tertiary by default. Filled magenta = .primary only. */
  button { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font: inherit; font-size: 14px; font-weight: 500; height: 36px; padding: 0 16px; border: 0; border-radius: calc(var(--radius) * 3);
    background: var(--default); color: var(--foreground); cursor: pointer; white-space: nowrap;
    transition: transform 250ms ease, background-color 100ms var(--ease-out), box-shadow 100ms var(--ease-out); }
  @media (hover: hover) { button:hover { background: var(--default-hover); } }
  button:active { transform: scale(0.97); }
  .primary { background: var(--accent); color: var(--accent-foreground); }
  @media (hover: hover) { .primary:hover { background: var(--accent-hover); } }
  button.danger { background: var(--danger-soft); color: var(--danger-soft-foreground); }
  @media (hover: hover) { button.danger:hover { background: var(--danger-soft-hover); } }
  /* Only .act buttons (they start an action through run()) lock during a sync; Save, chips and tabs stay usable. */
  button:disabled, body.busy .act { opacity: var(--disabled-opacity); cursor: default; pointer-events: none; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* Lucide icons. Decorative only: every icon sits next to text that names the action. */
  svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  body.busy #sync svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Tabs: HeroUI segmented tabs. Neutral, so they never compete with .primary. */
  nav { display: flex; padding: 4px; max-width: 820px; margin: 10px auto 0; background: var(--default); border-radius: calc(var(--radius) * 3); }
  nav button { flex: 1; height: 32px; background: transparent; color: var(--muted); }
  @media (hover: hover) { nav button:hover { background: transparent; color: var(--foreground); } }
  nav button.on { background: var(--segment); color: var(--foreground); box-shadow: var(--field-shadow); }

  /* Fields: no border; white fill + shadow in light, a lighter fill in dark. */
  input, select { font: inherit; width: 100%; height: 40px; padding: 0 12px; border: 0; border-radius: var(--field-radius);
    background: var(--field-background); color: var(--field-foreground); box-shadow: var(--field-shadow); }
  input::placeholder { color: var(--muted); }
  .search { position: relative; margin-top: 10px; }
  .search svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; color: var(--muted); pointer-events: none; }
  #search { padding-left: 36px; }

  /* Customizable select (Chrome 135+). Older Chrome ignores it and shows the native list. */
  select, ::picker(select) { appearance: base-select; }
  select { display: inline-flex; align-items: center; }
  select::picker-icon { color: var(--muted); }
  ::picker(select) { margin-top: 4px; padding: 4px; border: 0; border-radius: var(--field-radius); background: var(--overlay); color: var(--foreground); box-shadow: var(--overlay-shadow); }
  option { padding: 6px 10px; border-radius: var(--radius); font-size: 14px; }
  option:hover, option:focus-visible { background: var(--default); outline: 0; }
  option:checked { font-weight: 600; }

  /* Dialog: HeroUI AlertDialog look on a native <dialog>. */
  dialog { width: min(400px, calc(100% - 32px)); padding: 20px; border: 0; border-radius: calc(var(--radius) * 2);
    background: var(--overlay); color: var(--foreground); box-shadow: var(--overlay-shadow); }
  dialog::backdrop { background: var(--backdrop); }
  dialog[open] { animation: pop 200ms var(--ease-out); }
  @keyframes pop { from { opacity: 0; transform: scale(0.96); } }
  #dlg-msg { margin: 0 0 16px; white-space: pre-wrap; }
  #dlg-input { margin-bottom: 16px; background: var(--surface-secondary); box-shadow: none; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip { height: 30px; padding: 0 12px; font-size: 13px; border-radius: 999px; }
  .chip.on { background: var(--accent-soft); color: var(--accent-soft-foreground); font-weight: 600; }

  /* Lists and digests sit on surface cards. */
  .list { list-style: none; margin: 0; padding: 0 16px; background: var(--surface); border-radius: calc(var(--radius) * 2); box-shadow: var(--surface-shadow); }
  .list li { padding: 12px 0; border-bottom: 1px solid var(--separator); overflow-wrap: anywhere; }
  .list li:last-child { border-bottom: 0; }
  a { color: var(--accent-text); text-decoration: none; font-weight: 600; }
  a:hover { text-decoration: underline; }
  .list a { color: var(--foreground); }
  .muted, .empty { color: var(--muted); }
  .tag { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: var(--default); font-size: 12px; color: var(--muted); }
  .catpick { width: auto; height: 24px; margin-left: 6px; padding: 0 8px; border-radius: 999px; font-size: 12px; background: var(--default); color: var(--muted); box-shadow: none; }
  .cap { margin: 4px 0 0; font-size: 14px; color: var(--muted); }

  .summary { background: var(--surface); border-radius: calc(var(--radius) * 2); box-shadow: var(--surface-shadow); padding: 16px; margin-bottom: 12px; }
  /* Accordion header: chevron that turns up when open. */
  .summary > summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; font-weight: 600; list-style: none; }
  .summary > summary::-webkit-details-marker { display: none; }
  .summary > summary::after { content: ""; flex: none; width: 7px; height: 7px; margin-right: 4px; border: solid var(--muted); border-width: 0 2px 2px 0;
    transform: translateY(-2px) rotate(45deg); transition: transform 250ms ease; }
  .summary[open] > summary { margin-bottom: 12px; }
  .summary[open] > summary::after { transform: translateY(2px) rotate(-135deg); }
  .summary input { background: var(--surface-secondary); box-shadow: none; }
  .digest { white-space: pre-wrap; line-height: 1.7; margin-bottom: 12px; }
  .refine { display: flex; gap: 8px; margin: 12px 0; }
  .refine input { flex: 1; min-width: 0; }
  .refine button { height: 40px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  label { display: block; margin: 16px 0 4px; font-weight: 600; font-size: 14px; }
  label input, label select { margin-top: 6px; font-weight: 400; }
  hr { border: 0; border-top: 1px solid var(--separator); margin: 24px 0; }
  main > button { margin: 12px 8px 0 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 data-i18n="appName"></h1>
    <button id="sync" class="primary" data-i18n="sync"></button>
  </div>
  <nav>
    <button data-tab="following" data-i18n="tabFollowing"></button>
    <button data-tab="saved" data-i18n="tabSaved"></button>
    <button data-tab="bookmarks" data-i18n="tabBookmarks"></button>
    <button data-tab="settings" data-i18n="tabSettings"></button>
  </nav>
  <div class="bar search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="search" type="search"></div>
</header>
<progress id="prog" hidden></progress>
<div id="status" role="status"></div>
<main id="main"></main>
<dialog id="dlg">
  <p id="dlg-msg"></p>
  <input id="dlg-input" hidden aria-labelledby="dlg-msg">
  <div class="actions">
    <button type="button" id="dlg-cancel" data-i18n="cancel"></button>
    <button type="button" id="dlg-ok"></button>
  </div>
</dialog>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
