<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IG Sorter</title>
<style>
  /* --accent is link text; --sel is the selected-button fill under white text (5.1:1 in both modes). */
  :root { --bg: #fff; --fg: #1a1a1a; --muted: #6b6b6b; --line: #e4e4e4; --chip: #f2f2f2; --accent: #c13584; --sel: #c13584; --danger: #c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161616; --fg: #ececec; --muted: #9a9a9a; --line: #2e2e2e; --chip: #242424; --accent: #f06bb0; --danger: #ff7b7b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, "Noto Sans TC", sans-serif; }
  header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px; }
  .bar { display: flex; gap: 8px; align-items: center; max-width: 820px; margin: 0 auto; }
  h1 { font-size: 17px; margin: 0; flex: 1; }
  nav { display: flex; gap: 4px; max-width: 820px; margin: 10px auto 0; }
  nav button { flex: 1; }
  main, #status { max-width: 820px; margin: 0 auto; padding: 12px 16px; }
  #status { color: var(--muted); font-size: 13px; padding-bottom: 0; min-height: 1.5em; }
  button { font: inherit; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--chip); color: var(--fg); cursor: pointer; }
  /* Only .act buttons (they start an action through run()) lock during a sync; Save, chips and tabs stay usable. */
  button:disabled, body.busy .act { opacity: .5; cursor: default; pointer-events: none; }
  button.on, .chip.on { background: var(--sel); border-color: var(--sel); color: #fff; }
  button.danger { color: var(--danger); }
  input, select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); width: 100%; }
  #search { margin-top: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip { border-radius: 999px; padding: 4px 12px; font-size: 14px; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { padding: 10px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .muted, .empty { color: var(--muted); }
  .tag { display: inline-block; margin-left: 6px; padding: 0 8px; border-radius: 999px; background: var(--chip); font-size: 12px; color: var(--muted); }
  .catpick { width: auto; margin-left: 6px; padding: 1px 6px; border-radius: 999px; font-size: 12px; background: var(--chip); color: var(--muted); }
  .cap { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
  .summary { border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; }
  .summary h3 { margin: 0 0 8px; font-size: 16px; }
  .digest { white-space: pre-wrap; margin-bottom: 10px; }
  .refine { display: flex; gap: 8px; margin: 10px 0; }
  .refine input { flex: 1; min-width: 0; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; }
  label input, label select { margin-top: 4px; font-weight: 400; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
  main > button { margin: 12px 8px 0 0; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 data-i18n="appName"></h1>
    <button id="sync" data-i18n="sync"></button>
  </div>
  <nav>
    <button data-tab="following" data-i18n="tabFollowing"></button>
    <button data-tab="saved" data-i18n="tabSaved"></button>
    <button data-tab="bookmarks" data-i18n="tabBookmarks"></button>
    <button data-tab="settings" data-i18n="tabSettings"></button>
  </nav>
  <div class="bar"><input id="search" type="search"></div>
</header>
<div id="status" role="status"></div>
<main id="main"></main>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
